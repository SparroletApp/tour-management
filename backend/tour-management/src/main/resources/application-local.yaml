
spring:
  application:
    name: tourmanagement

  datasource:
    url: jdbc:postgresql://localhost:5432/tour_management
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_APP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: V7qN2xK9mR4tY8pL6sW3cF1hJ5zD9bG7uA2eX6nP4vQ8

garage:
  endpoint: ${GARAGE_ENDPOINT}
  bucket: ${GARAGE_BUCKET}
  access-key: ${GARAGE_ACCESS_KEY}
  secret-key: ${GARAGE_SECRET_KEY}
  public-base-url: ${GARAGE_PUBLIC_BASE_URL}
  region: garage


app:
  base-url:${GARAGE_PUBLIC_BASE_URL}


logging:
  level:
    org.springframework.security: TRACE
    com.example.tourmanagement.config: DEBUG

