
spring:
  application:
    name: tourmanagement

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}

file:
  upload-dir: C:/upload

app:
  base-url: ${APP_BASE_URL}

logging:
  level:
    org.springframework.security: TRACE
    com.example.tourmanagement.config: DEBUG

