
spring:
  application:
    name: tourmanagement

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}

garage:
  endpoint: ${GARAGE_ENDPOINT}
  bucket: ${GARAGE_BUCKET:tour-images}
  access-key: ${GARAGE_ACCESS_KEY}
  secret-key: ${GARAGE_SECRET_KEY}
  region: garage


app:
  base-url: ${APP_BASE_URL}

logging:
  level:
    org.springframework.security: INFO
    com.example.tourmanagement.config: DEBUG
